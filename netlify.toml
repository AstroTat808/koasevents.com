[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Admin pages require an authenticated Netlify Identity user with the admin role.
[[redirects]]
  from = "/admin/blog/*"
  to = "/admin/blog/:splat"
  status = 200
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/blog/*"
  to = "/admin/"
  status = 302

[[redirects]]
  from = "/admin/gallery/*"
  to = "/admin/gallery/:splat"
  status = 200
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/gallery/*"
  to = "/admin/"
  status = 302

[[redirects]]
  from = "/wedding-packages"
  to = "/venue/packages/"
  status = 301

[[redirects]]
  from = "/copy-of-wedding-packages"
  to = "/private-events/"
  status = 301

[[redirects]]
  from = "/koas-mobile-bar"
  to = "/mobile-bar/"
  status = 301

[[redirects]]
  from = "/a-la-carte"
  to = "/catalog/"
  status = 301

[[redirects]]
  from = "/booking"
  to = "/inquire/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/inquire/"
  status = 301

[[redirects]]
  from = "/custom-event-package-questionnaire"
  to = "/wedding-inquiry/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
