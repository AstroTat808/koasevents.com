# Deployment trigger check: 2026-09-22 pipeline audit
[build]
  command = "python3 scripts/production_visual_qa.py --mode source && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Content Admin authorization is enforced in the admin UI and server-side functions.
# Approved administrators are restricted to the allowlist in netlify/functions/_shared/admin.ts.



[[redirects]]
  from = "https://www.koasevents.com/*"
  to = "https://koasevents.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/guest-suites"
  to = "/stay/"
  status = 301

[[redirects]]
  from = "/events"
  to = "/weddings/"
  status = 301

[[redirects]]
  from = "/post/*"
  to = "/blog/:splat/"
  status = 301

[[redirects]]
  from = "/wedding-packages"
  to = "/venue/packages/"
  status = 301

[[redirects]]
  from = "/copy-of-wedding-packages"
  to = "/private-events/"
  status = 301

[[redirects]]
  from = "/koas-mobile-bar"
  to = "/mobile-bar/"
  status = 301

[[redirects]]
  from = "/a-la-carte"
  to = "/catalog/"
  status = 301

[[redirects]]
  from = "/booking"
  to = "/inquire/"
  status = 301

[[redirects]]
  from = "/custom-event-package-questionnaire"
  to = "/wedding-inquiry/"
  status = 301


[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/staff/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/booking/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/proposal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/planning/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/wedding-inquiry-thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
