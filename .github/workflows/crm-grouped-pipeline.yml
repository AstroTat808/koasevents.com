name: CRM grouped pipeline and duplicate protection

on:
  pull_request:
    paths:
      - 'netlify/functions/admin-crm.mts'
      - 'netlify/functions/crm-inquiries.mts'
      - 'netlify/functions/_shared/crm-duplicate-review.mjs'
      - 'netlify/functions/_shared/crm-inquiry-replay.mjs'
      - 'netlify/functions/_shared/duplicate-bookings.mjs'
      - 'public/scripts/crm-pipeline-groups.js'
      - 'src/pages/admin/crm/**'
      - 'scripts/test_crm_grouped_pipeline*'
      - 'scripts/test_duplicate_bookings.mjs'
      - 'package.json'
      - '.github/workflows/crm-grouped-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grouped-pipeline:
    name: Grouping, replay, audits and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate grouped pipeline, identity classification and merge/replay safety
        run: |
          npm run test:crm-grouping
          node --test scripts/test_crm_customer_directory.mjs
      - name: Build complete website and CRM pages
        run: npm run build
      - name: Install isolated test browsers
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Chromium and WebKit grouped CRM QA (iPhone, desktop, Light and Dark)
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/crm-grouping.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/admin/crm/ >/dev/null; then break; fi
            sleep 1
          done
          python scripts/test_crm_grouped_pipeline_browser.py --base-url http://127.0.0.1:4173
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-grouped-pipeline-synthetic-qa
          path: visual-results/crm-grouping/
          if-no-files-found: warn
          retention-days: 14
