name: Migrate Wix media to local assets

on:
  push:
    branches:
      - main
    paths:
      - scripts/migrate_wix_media.py
      - .github/workflows/migrate-wix-media.yml

permissions:
  contents: write

concurrency:
  group: migrate-wix-media
  cancel-in-progress: false

jobs:
  migrate:
    name: Copy Wix images into repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Wix media and rewrite source paths
        run: python scripts/migrate_wix_media.py

      - name: Verify no Wix image dependencies remain
        run: |
          if grep -R "static.wixstatic.com" src; then
            echo "Wix image dependency remains in src/."
            exit 1
          fi
          test -f public/media/wix/manifest.json

      - name: Commit migrated images
        run: |
          git config user.name "Koa Events Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/media/wix src
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Migrate Wix photos to local site assets"
          git push origin HEAD:main
