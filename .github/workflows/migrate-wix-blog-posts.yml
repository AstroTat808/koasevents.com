name: Migrate Wix blog posts

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/migrate_wix_blog.py"
      - ".github/workflows/migrate-wix-blog-posts.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: pip install requests beautifulsoup4
      - name: Import Wix blog
        run: python scripts/migrate_wix_blog.py
      - name: Commit imported posts and images
        run: |
          if git diff --quiet -- src/data/wixBlogPosts.ts public/media/blog; then
            echo "No blog migration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/wixBlogPosts.ts public/media/blog
          git commit -m "Migrate Wix blog posts and featured images"
          git push
