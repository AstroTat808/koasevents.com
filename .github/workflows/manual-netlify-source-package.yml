name: Manual Netlify source package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-netlify-source-package.yml'

permissions:
  contents: read

jobs:
  package-source:
    name: Package current source for manual Netlify recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package repository source
        shell: bash
        run: |
          set -euo pipefail
          tar             --exclude='./node_modules'             --exclude='./dist'             --exclude='./.netlify'             -czf /tmp/koasevents-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: koasevents-netlify-source-${{ github.sha }}
          path: /tmp/koasevents-source.tgz
          retention-days: 1
          if-no-files-found: error

      - name: Package Netlify MCP runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/netlify-mcp-runtime
          cd /tmp/netlify-mcp-runtime
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @netlify/mcp@1.16.0
          tar -czf /tmp/netlify-mcp-runtime.tgz node_modules package.json package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: netlify-mcp-runtime-${{ github.sha }}
          path: /tmp/netlify-mcp-runtime.tgz
          retention-days: 1
          if-no-files-found: error
