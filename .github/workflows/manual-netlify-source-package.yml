name: Manual Netlify source package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-netlify-source-package.yml'

permissions:
  contents: read

jobs:
  package-source:
    name: Package current source for manual Netlify recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package repository source
        shell: bash
        run: |
          set -euo pipefail
          tar             --exclude='./node_modules'             --exclude='./dist'             --exclude='./.netlify'             -czf /tmp/koasevents-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: koasevents-netlify-source-${{ github.sha }}
          path: /tmp/koasevents-source.tgz
          retention-days: 1
          if-no-files-found: error
