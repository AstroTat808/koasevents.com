name: Generate GBP JPEG Media

on:
  push:
    branches: [main]
    paths:
      - "docs/google-business-profile-content-calendar-2026-2027.md"
      - "public/media/koa/**"
      - "scripts/generate_gbp_jpgs.py"
      - ".github/workflows/generate-gbp-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate GBP JPEGs
        run: python scripts/generate_gbp_jpgs.py

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/gbp
          if git diff --cached --quiet; then
            echo "GBP media already current."
          else
            git commit -m "Generate GBP publishing media"
            git push
          fi
