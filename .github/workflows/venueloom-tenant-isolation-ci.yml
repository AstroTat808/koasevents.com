name: VenueLoom tenant isolation CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PRODUCTION_BASE_URL: https://koasevents.com
  EXPECTED_COMMIT: ${{ github.sha }}

jobs:
  tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit tenant storage and integration boundaries
        run: |
          node scripts/audit_tenant_storage_access.mjs
          node scripts/audit_tenant_integration_env.mjs
          node scripts/audit_tenant_scheduled_jobs.mjs
          node scripts/audit_tenant_request_context.mjs

      - name: Run cross-tenant regression tests
        run: |
          node scripts/test_tenant_isolation.mjs
          node scripts/tenant_isolation_qa.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build with all P0 and accounting gates
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

  publish-main-readiness:
    name: Publish signed tenant-isolation readiness
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tenant-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for this exact Netlify production deploy
        run: python scripts/production_visual_qa.py --mode wait --wait-seconds 900

      - name: Publish signed isolation-CI identity
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            https://koasevents.com/api/system-health/github-main-signal
