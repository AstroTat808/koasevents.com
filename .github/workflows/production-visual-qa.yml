name: Production visual QA

# Full release evidence is required on every PR, including docs/config-only PRs.
# This workflow also performs the authenticated System Health audit on every
# production main push, with no path-based blind spots.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL to audit'
        required: false
        default: 'https://koasevents.com'

concurrency:
  group: koa-production-visual-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  id-token: write

env:
  # Deploy previews on the production Netlify project require Netlify authentication.
  # PRs therefore run source/build QA only; full live QA runs against production after merge.
  PRODUCTION_BASE_URL: ${{ inputs.base_url || 'https://koasevents.com' }}
  EXPECTED_COMMIT: ${{ github.sha }}
  VISUAL_RESULTS: visual-results

jobs:
  source-build-audit:
    name: Source + Astro build audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - name: Structural build-safety gate
        run: npm run build:safety
      - name: Build production site
        run: npm run build
      - name: Test inquiry security rules
        run: node --experimental-strip-types scripts/security_logic_qa.mjs
      - name: Audit source structure
        run: python scripts/production_visual_qa.py --mode source
      - name: Install System Health responsive browser QA dependencies
        if: github.event_name == 'pull_request'
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify site-wide Light / Dark / System themes in Chromium and WebKit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4174 --directory dist > /tmp/koa-theme-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/koa-theme-preview.log
            exit 1
          fi
          python scripts/theme_visual_qa.py --browser chromium --base-url http://127.0.0.1:4174
          python scripts/theme_visual_qa.py --browser webkit --base-url http://127.0.0.1:4174
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && always()
        with:
          name: koa-theme-responsive-pr-${{ github.run_id }}
          path: |
            visual-results/theme-source-audit.json
            visual-results/theme-chromium
            visual-results/theme-webkit
          retention-days: 30
          if-no-files-found: error
      - name: Create local System Health QA snapshot
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p visual-results
          cat > visual-results/system-health-dashboard.json <<'JSON'
          {
            "current": {
              "overall": "healthy",
              "passed": 78,
              "failed": 0,
              "checkedAt": "2026-10-01T19:13:40-10:00",
              "checks": []
            },
            "coverage": {},
            "criticalIntegrations": {},
            "rollbackReady": {},
            "runtime": {},
            "deployments": {},
            "office365": {},
            "emailHealth": {},
            "credentialHealth": {},
            "weeklyExecutiveSummary": {},
            "accountingHealth": {},
            "visualQuality": {
              "status": "passed",
              "checkedAt": "2026-10-01T19:13:41-10:00",
              "source": "production-visual-qa",
              "runId": "pr-preview",
              "commit": "preview",
              "deployId": "preview",
              "chromium": {
                "browser":"chromium","routes":69,"cases":283,"failureCount":0,"failedRouteCount":0,"reportMissing":false,
                "routeResults":[
                  {"route":"/","status":"passed","cases":4,"failureCount":0,"failures":[]},
                  {"route":"/admin/health/","status":"passed","cases":4,"failureCount":0,"failures":[]}
                ]
              },
              "webkit": {
                "browser":"webkit","routes":69,"cases":283,"failureCount":0,"failedRouteCount":0,"reportMissing":false,
                "routeResults":[
                  {"route":"/","status":"passed","cases":4,"failureCount":0,"failures":[]},
                  {"route":"/admin/health/","status":"passed","cases":4,"failureCount":0,"failures":[]}
                ]
              },
              "screenshots":[
                {"key":"light-phone","theme":"light","viewport":"phone","browser":"chromium","route":"/admin/health/","width":390,"height":844,"contentType":"image/jpeg","url":"/api/admin/health?action=dark-mode-qa-screenshot&deployId=preview&key=light-phone"},
                {"key":"dark-phone","theme":"dark","viewport":"phone","browser":"chromium","route":"/admin/health/","width":390,"height":844,"contentType":"image/jpeg","url":"/api/admin/health?action=dark-mode-qa-screenshot&deployId=preview&key=dark-phone"},
                {"key":"light-desktop","theme":"light","viewport":"desktop","browser":"chromium","route":"/admin/health/","width":1440,"height":900,"contentType":"image/jpeg","url":"/api/admin/health?action=dark-mode-qa-screenshot&deployId=preview&key=light-desktop"},
                {"key":"dark-desktop","theme":"dark","viewport":"desktop","browser":"chromium","route":"/admin/health/","width":1440,"height":900,"contentType":"image/jpeg","url":"/api/admin/health?action=dark-mode-qa-screenshot&deployId=preview&key=dark-desktop"}
              ],
              "detail": "Preview visual-quality fixture."
            },
            "enrichmentWarnings": []
          }
          JSON
      - name: Verify System Health responsive layout in Chromium and WebKit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory dist > /tmp/koa-health-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/admin/health/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/koa-health-preview.log
            exit 1
          fi
          python scripts/production_visual_qa.py --mode health-mobile --browser chromium --base-url http://127.0.0.1:4173 --health-payload visual-results/system-health-dashboard-sanitized.json
          python scripts/production_visual_qa.py --mode health-mobile --browser webkit --base-url http://127.0.0.1:4173 --health-payload visual-results/system-health-dashboard-sanitized.json
      - name: Verify iPhone admin bottom navigation in built PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4175 --directory dist > /tmp/koa-admin-mobile-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/admin/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/koa-admin-mobile-preview.log
            exit 1
          fi
          python scripts/production_visual_qa.py --mode admin-mobile --browser chromium --base-url http://127.0.0.1:4175
          python scripts/production_visual_qa.py --mode admin-mobile --browser webkit --base-url http://127.0.0.1:4175
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && always()
        with:
          name: koa-system-health-responsive-pr-${{ github.run_id }}
          path: |
            visual-results/system-health-dashboard.json
            visual-results/health-mobile-chromium
            visual-results/health-mobile-webkit
            visual-results/admin-mobile-chromium
            visual-results/admin-mobile-webkit
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koa-source-audit-${{ github.run_id }}
          path: |
            visual-results/source-audit.json
            visual-results/theme-source-audit.json
          retention-days: 14
          if-no-files-found: error

  deployed-smoke:
    name: Deploy route + asset smoke
    if: github.event_name != 'pull_request'
    needs: source-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait five minutes for exact Netlify production SHA
        id: initial-netlify-wait
        continue-on-error: true
        run: python scripts/production_visual_qa.py --mode wait --wait-seconds 300
      - name: Self-heal missing Netlify production deploy
        if: steps.initial-netlify-wait.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          recovery_file="$(mktemp)"
          http_status="$(curl -sS \
            -o "$recovery_file" \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"action":"self-heal-production-deploy"}' \
            https://koasevents.com/api/system-health/github-main-signal)"
          python -c 'import json,os,sys; data=json.load(open(sys.argv[1])); assert data.get("ok") is True; assert data.get("expectedSha")==os.environ["EXPECTED_COMMIT"]; assert data.get("triggered") is True or data.get("exactShaPresent") is True' "$recovery_file"
          rm -f "$recovery_file"
          echo "Production deploy self-heal response validated without logging response content."
          test "$http_status" = "200"
      - name: Wait for exact Netlify production SHA after fallback
        if: steps.initial-netlify-wait.outcome == 'failure'
        run: python scripts/production_visual_qa.py --mode wait --wait-seconds 600
      - name: Verify production health and guard the release
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          verification_file="$(mktemp)"
          http_status="$(curl -sS \
            -o "$verification_file" \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"action":"verify-production-health"}' \
            https://koasevents.com/api/system-health/github-main-signal)"
          python -c 'import json,sys; data=json.load(open(sys.argv[1])); accounting=data.get("accountingInvariant") or {}; assert data.get("auditRecorded") is True; assert data.get("ok") is True; assert len(data.get("probes",[])) == 4; assert all(p.get("ok") and p.get("status")==204 and p.get("source")=="live" and p.get("marker")==p.get("expectedMarker") for p in data["probes"]); assert accounting.get("ok") is True; assert accounting.get("status")==200; assert accounting.get("expectedTotal")==accounting.get("actualTotal"); assert accounting.get("taxablePayload")==0; assert accounting.get("liveClientStatus")=="passed"; assert accounting.get("liveClientTaxableLineCount")==0; assert accounting.get("historicalTaxOnTaxDetected") is False; assert accounting.get("dynamicClientStatus")=="passed"; assert accounting.get("dynamicClientFailedCount")==0; assert accounting.get("dynamicClientUnverifiedCount")==0; assert accounting.get("dynamicClientPassedCount")==accounting.get("dynamicClientCount")' "$verification_file"
          rm -f "$verification_file"
          echo "Production health response validated without logging client, accounting, or raw response content."
          test "$http_status" = "200"
      - name: Check public routes and headers
        run: python scripts/production_visual_qa.py --mode smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koa-production-smoke-${{ github.run_id }}
          path: visual-results/production-smoke.json
          retention-days: 14
          if-no-files-found: error

  production-theme-audit:
    name: Live Light / Dark / System audit
    if: github.event_name != 'pull_request'
    needs: source-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build route inventory
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install browser QA dependencies
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Wait for exact Netlify production SHA
        run: python scripts/production_visual_qa.py --mode wait --wait-seconds 900
      - name: Verify live Light / Dark / System in Chromium
        run: python scripts/theme_visual_qa.py --browser chromium --base-url "$PRODUCTION_BASE_URL"
      - name: Verify live Light / Dark / System in WebKit
        run: python scripts/theme_visual_qa.py --browser webkit --base-url "$PRODUCTION_BASE_URL"
      - name: Publish Dark Mode visual-quality result to System Health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json
          from datetime import datetime, timezone
          from pathlib import Path

          def load_report(browser):
              path=Path(f'visual-results/theme-{browser}/report.json')
              if not path.is_file():
                  return None
              try:
                  value=json.loads(path.read_text())
                  return value if isinstance(value,dict) else None
              except Exception:
                  return None

          def summarize(browser):
              report=load_report(browser)
              if report is None:
                  return {
                      'browser':browser,
                      'routes':0,
                      'cases':0,
                      'failureCount':1,
                      'failedRouteCount':0,
                      'reportMissing':True,
                      'routeResults':[],
                  }
              by_route={}
              for row in report.get('results') or []:
                  if not isinstance(row,dict):
                      continue
                  route=str(row.get('route') or '').strip()
                  if not route:
                      continue
                  target=by_route.setdefault(route,{'route':route,'cases':0,'failureCount':0,'failures':[],'failedCases':[]})
                  target['cases']+=1
                  failure=str(row.get('failure') or '').strip()
                  if failure:
                      target['failureCount']+=1
                      preference=str(row.get('preference') or '').strip()
                      resolved=str(row.get('resolved') or '').strip()
                      os_scheme=str(row.get('osScheme') or '').strip()
                      surface=str(row.get('surface') or '').strip()
                      viewport=str(row.get('viewport') or '').strip()
                      theme=preference or resolved or 'unknown'
                      if preference=='system' and os_scheme:
                          theme='system → '+resolved+' (OS '+os_scheme+')'
                      elif preference in {'account-dark','navbar-toggle'}:
                          theme=preference+' → '+resolved
                      label=' / '.join(value for value in (theme,viewport,surface) if value)
                      message=(label+': ' if label else '')+failure
                      if message not in target['failures'] and len(target['failures'])<12:
                          target['failures'].append(message[:500])
                      failed_case={
                          'theme':theme[:120],
                          'viewport':viewport[:80] or 'unknown',
                          'detail':failure[:500],
                      }
                      if failed_case not in target['failedCases'] and len(target['failedCases'])<24:
                          target['failedCases'].append(failed_case)
              route_results=[]
              for route in sorted(by_route):
                  row=by_route[route]
                  route_results.append({
                      'route':route,
                      'status':'failed' if row['failureCount'] else 'passed',
                      'cases':row['cases'],
                      'failureCount':row['failureCount'],
                      'failures':row['failures'],
                      'failedCases':row['failedCases'],
                  })
              return {
                  'browser':browser,
                  'routes':int(report.get('routes') or 0),
                  'cases':int(report.get('cases') or 0),
                  'failureCount':len(report.get('failures') or []),
                  'failedRouteCount':sum(1 for row in route_results if row['status']=='failed'),
                  'reportMissing':False,
                  'routeResults':route_results,
              }

          def screenshots():
              rows=[]
              sizes={'phone':(390,844),'desktop':(1440,900)}
              for theme in ('light','dark'):
                  for viewport in ('phone','desktop'):
                      for browser in ('chromium','webkit'):
                          report=load_report(browser)
                          path=Path(f'visual-results/theme-{browser}/thumbnail-{theme}-{viewport}.jpg')
                          if report is None or not path.is_file():
                              continue
                          width,height=sizes[viewport]
                          rows.append({
                              'key':f'{theme}-{viewport}',
                              'theme':theme,
                              'viewport':viewport,
                              'browser':browser,
                              'route':str(report.get('thumbnailRoute') or '/admin/health/'),
                              'width':width,
                              'height':height,
                              'dataBase64':base64.b64encode(path.read_bytes()).decode('ascii'),
                          })
                          break
              return rows

          payload={
              'action':'record-dark-mode-visual-quality',
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'chromium':summarize('chromium'),
              'webkit':summarize('webkit'),
              'screenshots':screenshots(),
          }
          Path('/tmp/dark-mode-visual-quality.json').write_text(json.dumps(payload,separators=(',',':')))
          print(json.dumps({
              'chromium':payload['chromium'],
              'webkit':payload['webkit'],
              'screenshots':[{key:value for key,value in row.items() if key!='dataBase64'} for row in payload['screenshots']],
          },separators=(',',':')))
          PY
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          response_file="$(mktemp)"
          http_status="$(curl -sS -o "$response_file" -w "%{http_code}" -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data-binary @/tmp/dark-mode-visual-quality.json https://koasevents.com/api/system-health/github-main-signal)"
          python -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data.get("ok") is True' "$response_file"
          rm -f "$response_file" /tmp/dark-mode-visual-quality.json
          echo "Dark Mode visual-quality result accepted without logging the API response."
          test "$http_status" = "200"
      - name: Remove live theme evidence from runner
        if: always()
        run: rm -rf visual-results/theme-chromium visual-results/theme-webkit

  admin-startup-audit:
    name: Protected admin post-deploy audit
    if: github.event_name != 'pull_request'
    needs: source-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Wait for this exact Netlify deploy
        run: python scripts/production_visual_qa.py --mode wait --wait-seconds 900
      - name: Verify every protected admin page and API without retaining authenticated output
        shell: bash
        run: |
          set -euo pipefail
          if ! python scripts/production_visual_qa.py --mode admin --browser chromium > /tmp/admin-qa.log 2>&1; then
            echo "Protected admin QA failed; raw browser output is intentionally suppressed to prevent PII disclosure."
            exit 1
          fi
          rm -f /tmp/admin-qa.log
          rm -rf visual-results/admin-chromium

  system-health-mobile-audit:
    name: System Health authenticated mobile screenshots
    if: github.event_name != 'pull_request' && always()
    needs: [deployed-smoke, production-theme-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mobile browser QA dependencies
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Run signed live System Health dashboard refresh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-results
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          http_status="000"
          for attempt in 1 2 3; do
            http_status="$(curl -sS \
              --connect-timeout 15 \
              --max-time 55 \
              -o /tmp/system-health-dashboard.raw.json \
              -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data '{"action":"run-dashboard-refresh"}' \
              https://koasevents.com/api/system-health/github-main-signal || true)"
            if [ "$http_status" = "200" ] && python -c 'import json,sys; from pathlib import Path; p=Path("/tmp/system-health-dashboard.raw.json"); data=json.loads(p.read_text()); current=data.get("current") or {}; sys.exit(0 if data.get("ok") is True and current.get("checkedAt") else 1)'; then
              break
            fi
            echo "Signed System Health refresh attempt ${attempt}/3 failed with HTTP ${http_status}."
            if [ "$attempt" != "3" ]; then sleep $((attempt * 5)); fi
          done
          test "$http_status" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/system-health-dashboard.raw.json')
          data=json.loads(raw.read_text())
          current=data.get('current') or {}
          assert data.get('ok') is True
          assert current.get('checkedAt')
          assert isinstance(current.get('passed'),int)
          assert isinstance(current.get('failed'),int)
          assert current.get('overall') in {'healthy','unhealthy'}
          warning_count=len(data.get('enrichmentWarnings') or [])
          safe={
              'ok': True,
              'current': {
                  'overall': current.get('overall'),
                  'passed': current.get('passed'),
                  'failed': current.get('failed'),
                  'checkedAt': current.get('checkedAt'),
                  'checks': [],
              },
              'coverage': {},
              'criticalIntegrations': {},
              'rollbackReady': {},
              'runtime': {},
              'deployments': {},
              'office365': {},
              'emailHealth': {},
              'credentialHealth': {},
              'weeklyExecutiveSummary': {},
              'accountingHealth': {},
              'visualQuality': {},
              'enrichmentWarnings': [
                  {'message':'Enrichment warning details redacted from CI.'}
                  for _ in range(warning_count)
              ],
          }
          Path('visual-results/system-health-dashboard-sanitized.json').write_text(json.dumps(safe,separators=(',',':')))
          raw.unlink(missing_ok=True)
          print(json.dumps({
              'ok': True,
              'overall': current.get('overall'),
              'passed': current.get('passed'),
              'failed': current.get('failed'),
              'checkedAt': current.get('checkedAt'),
              'enrichmentWarningCount': warning_count,
          },separators=(',',':')))
          PY
      - name: Verify authenticated mobile System Health in Chromium
        run: python scripts/production_visual_qa.py --mode health-mobile --browser chromium --health-payload visual-results/system-health-dashboard-sanitized.json
      - name: Verify authenticated mobile System Health in WebKit
        run: python scripts/production_visual_qa.py --mode health-mobile --browser webkit --health-payload visual-results/system-health-dashboard-sanitized.json
      - name: Publish System Health production release status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              p=Path(path)
              if not p.is_file():
                  return None
              try:
                  return json.loads(p.read_text())
              except Exception:
                  return None

          dashboard=load('visual-results/system-health-dashboard-sanitized.json') or {}
          chromium=load('visual-results/health-mobile-chromium/report.json') or {}
          webkit=load('visual-results/health-mobile-webkit/report.json') or {}
          current=dashboard.get('current') or {}
          warnings=dashboard.get('enrichmentWarnings') or []
          expected_refresh='Partial' if warnings else 'Current'

          reports=[chromium,webkit]
          reports_complete=all(
              isinstance(report.get('results'),list)
              and len(report.get('results'))==7
              and not (report.get('failures') or [])
              for report in reports
          )
          refresh_checks=[]
          for report in reports:
              for row in report.get('results') or []:
                  after=(row.get('metrics') or {}).get('afterRunChecksNow') or {}
                  refresh_checks.append(
                      after.get('passed')==str(current.get('passed'))
                      and after.get('failed')==str(current.get('failed'))
                      and bool(after.get('checked'))
                      and after.get('dashboardRefresh')==expected_refresh
                  )

          ok=bool(
              dashboard.get('ok') is True
              and current.get('checkedAt')
              and isinstance(current.get('passed'),int)
              and isinstance(current.get('failed'),int)
              and current.get('overall') in {'healthy','unhealthy'}
              and reports_complete
              and len(refresh_checks)==14
              and all(refresh_checks)
          )

          overall=str(current.get('overall') or 'unknown').title()
          passed=current.get('passed','?')
          failed=current.get('failed','?')
          description=f'{overall} · {passed} passed · {failed} failed · Refresh {expected_refresh} · 14 responsive checks'
          payload={
              'state':'success' if ok else 'failure',
              'context':'System Health production release gate',
              'description':description[:140],
          }
          Path('/tmp/system-health-commit-status.json').write_text(json.dumps(payload,separators=(',',':')))
          print(json.dumps({
              'ok':ok,
              'overall':current.get('overall'),
              'passed':current.get('passed'),
              'failed':current.get('failed'),
              'checkedAt':current.get('checkedAt'),
              'dashboardRefresh':expected_refresh,
              'enrichmentWarningCount':len(warnings),
              'chromiumViewports':len(chromium.get('results') or []),
              'webkitViewports':len(webkit.get('results') or []),
              'chromiumFailureCount':len(chromium.get('failures') or []),
              'webkitFailureCount':len(webkit.get('failures') or []),
          },separators=(',',':')))
          PY
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/tmp/system-health-commit-status.json')
          data=json.loads(p.read_text())
          data['target_url']=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          p.write_text(json.dumps(data,separators=(',',':')))
          PY
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/system-health-commit-status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
      - name: Remove authenticated System Health evidence from runner
        if: always()
        run: |
          rm -f /tmp/system-health-dashboard.raw.json
          rm -f visual-results/system-health-dashboard-sanitized.json
          rm -rf visual-results/health-mobile-chromium visual-results/health-mobile-webkit
  visual-audit:
    name: Responsive visual audit
    if: github.event_name != 'pull_request'
    needs: deployed-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Audit responsive production experience without retaining authenticated output
        shell: bash
        run: |
          set -euo pipefail
          if ! python scripts/production_visual_qa.py --mode browser --browser ${{ matrix.browser }} > /tmp/browser-qa.log 2>&1; then
            echo "Responsive production QA failed; raw browser output is intentionally suppressed to prevent PII disclosure."
            exit 1
          fi
          rm -f /tmp/browser-qa.log
          rm -rf visual-results/browser-${{ matrix.browser }}

  qa-summary:
    name: Visual QA summary
    if: always()
    needs: [source-build-audit, deployed-smoke, production-theme-audit, admin-startup-audit, system-health-mobile-audit, visual-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Publish run summary
        run: |
          {
            echo '## Koa’s Events production visual QA'
            echo
            echo '| Gate | Result |'
            echo '| --- | --- |'
            echo '| Source + Astro build | ${{ needs.source-build-audit.result }} |'
            echo '| Live production route smoke | ${{ needs.deployed-smoke.result }} |'
            echo '| Live Light / Dark / System audit | ${{ needs.production-theme-audit.result }} |'
            echo '| Protected admin post-deploy audit | ${{ needs.admin-startup-audit.result }} |'
            echo '| Authenticated System Health mobile screenshots | ${{ needs.system-health-mobile-audit.result }} |'
            echo '| Live responsive visual audit | ${{ needs.visual-audit.result }} |'
            echo
            echo 'Authenticated production browser output is ephemeral and is not uploaded as an Actions artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
