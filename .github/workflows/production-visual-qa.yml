name: Production visual QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-visual-qa.yml'
      - 'scripts/production_visual_qa.py'
      - 'scripts/theme_visual_qa.py'
      - 'scripts/security_logic_qa.mjs'
      - 'scripts/build_safety_check.mjs'
      - 'scripts/test_system_health_dashboard.mjs'
      - 'scripts/verify_netlify_release_gate.mjs'
      - 'src/**'
      - 'netlify/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'netlify.toml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-visual-qa.yml'
      - 'scripts/production_visual_qa.py'
      - 'scripts/theme_visual_qa.py'
      - 'scripts/security_logic_qa.mjs'
      - 'scripts/build_safety_check.mjs'
      - 'scripts/test_system_health_dashboard.mjs'
      - 'scripts/verify_netlify_release_gate.mjs'
      - 'src/**'
      - 'netlify/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'netlify.toml'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL to audit'
        required: false
        default: 'https://koasevents.com'

concurrency:
  group: koa-production-visual-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  id-token: write

env:
  # Deploy previews on the production Netlify project require Netlify authentication.
  # PRs therefore run source/build QA only; full live QA runs against production after merge.
  PRODUCTION_BASE_URL: ${{ inputs.base_url || 'https://koasevents.com' }}
  EXPECTED_COMMIT: ${{ github.sha }}
  VISUAL_RESULTS: visual-results

jobs:
  source-build-audit:
    name: Source + Astro build audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - name: Structural build-safety gate
        run: npm run build:safety
      - name: Build production site
        run: npm run build
      - name: Test inquiry security rules
        run: node --experimental-strip-types scripts/security_logic_qa.mjs
      - name: Audit source structure
        run: python scripts/production_visual_qa.py --mode source
      - name: Install System Health responsive browser QA dependencies
        if: github.event_name == 'pull_request'
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify site-wide Light / Dark / System themes in Chromium and WebKit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4174 --directory dist > /tmp/koa-theme-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/koa-theme-preview.log
            exit 1
          fi
          python scripts/theme_visual_qa.py --browser chromium --base-url http://127.0.0.1:4174
          python scripts/theme_visual_qa.py --browser webkit --base-url http://127.0.0.1:4174
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && always()
        with:
          name: koa-theme-responsive-pr-${{ github.run_id }}
          path: |
            visual-results/theme-source-audit.json
            visual-results/theme-chromium
            visual-results/theme-webkit
          retention-days: 30
          if-no-files-found: error
      - name: Create local System Health QA snapshot
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p visual-results
          cat > visual-results/system-health-dashboard.json <<'JSON'
          {
            "current": {
              "overall": "healthy",
              "passed": 78,
              "failed": 0,
              "checkedAt": "2026-10-01T19:13:40-10:00",
              "checks": []
            },
            "coverage": {},
            "criticalIntegrations": {},
            "rollbackReady": {},
            "runtime": {},
            "deployments": {},
            "office365": {},
            "emailHealth": {},
            "credentialHealth": {},
            "weeklyExecutiveSummary": {},
            "accountingHealth": {},
            "visualQuality": {
              "status": "passed",
              "checkedAt": "2026-10-01T19:13:41-10:00",
              "source": "production-visual-qa",
              "runId": "pr-preview",
              "commit": "preview",
              "deployId": "preview",
              "chromium": {"browser":"chromium","routes":69,"cases":283,"failureCount":0,"reportMissing":false},
              "webkit": {"browser":"webkit","routes":69,"cases":283,"failureCount":0,"reportMissing":false},
              "detail": "Preview visual-quality fixture."
            },
            "enrichmentWarnings": []
          }
          JSON
      - name: Verify System Health responsive layout in Chromium and WebKit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory dist > /tmp/koa-health-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/admin/health/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/koa-health-preview.log
            exit 1
          fi
          python scripts/production_visual_qa.py --mode health-mobile --browser chromium --base-url http://127.0.0.1:4173 --health-payload visual-results/system-health-dashboard.json
          python scripts/production_visual_qa.py --mode health-mobile --browser webkit --base-url http://127.0.0.1:4173 --health-payload visual-results/system-health-dashboard.json
      - name: Verify iPhone admin bottom navigation in built PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4175 --directory dist > /tmp/koa-admin-mobile-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/admin/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/koa-admin-mobile-preview.log
            exit 1
          fi
          python scripts/production_visual_qa.py --mode admin-mobile --browser chromium --base-url http://127.0.0.1:4175
          python scripts/production_visual_qa.py --mode admin-mobile --browser webkit --base-url http://127.0.0.1:4175
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && always()
        with:
          name: koa-system-health-responsive-pr-${{ github.run_id }}
          path: |
            visual-results/system-health-dashboard.json
            visual-results/health-mobile-chromium
            visual-results/health-mobile-webkit
            visual-results/admin-mobile-chromium
            visual-results/admin-mobile-webkit
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koa-source-audit-${{ github.run_id }}
          path: |
            visual-results/source-audit.json
            visual-results/theme-source-audit.json
          retention-days: 14
          if-no-files-found: error

  deployed-smoke:
    name: Deploy route + asset smoke
    if: github.event_name != 'pull_request'
    needs: source-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait five minutes for exact Netlify production SHA
        id: initial-netlify-wait
        continue-on-error: true
        run: python scripts/production_visual_qa.py --mode wait --wait-seconds 300
      - name: Self-heal missing Netlify production deploy
        if: steps.initial-netlify-wait.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          recovery_file="$(mktemp)"
          http_status="$(curl -sS \
            -o "$recovery_file" \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"action":"self-heal-production-deploy"}' \
            https://koasevents.com/api/system-health/github-main-signal)"
          recovery="$(cat "$recovery_file")"
          rm -f "$recovery_file"
          echo "$recovery"
          python -c 'import json,os,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("expectedSha")==os.environ["EXPECTED_COMMIT"]; assert data.get("triggered") is True or data.get("exactShaPresent") is True' <<<"$recovery"
          test "$http_status" = "200"
      - name: Wait for exact Netlify production SHA after fallback
        if: steps.initial-netlify-wait.outcome == 'failure'
        run: python scripts/production_visual_qa.py --mode wait --wait-seconds 600
      - name: Verify production health and guard the release
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          verification_file="$(mktemp)"
          http_status="$(curl -sS \
            -o "$verification_file" \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"action":"verify-production-health"}' \
            https://koasevents.com/api/system-health/github-main-signal)"
          verification="$(cat "$verification_file")"
          rm -f "$verification_file"
          echo "$verification"
          python -c 'import json,sys; data=json.load(sys.stdin); accounting=data.get("accountingInvariant") or {}; assert data.get("auditRecorded") is True; assert data.get("ok") is True; assert len(data.get("probes",[])) == 4; assert all(p.get("ok") and p.get("status")==204 and p.get("source")=="live" and p.get("marker")==p.get("expectedMarker") for p in data["probes"]); assert accounting.get("ok") is True; assert accounting.get("status")==200; assert accounting.get("expectedTotal")==15706.8; assert accounting.get("actualTotal")==15706.8; assert accounting.get("taxablePayload")==0; assert accounting.get("liveClientStatus")=="passed"; assert accounting.get("liveClientEstimateTotal")==15706.8; assert accounting.get("liveClientTaxableLineCount")==0; assert accounting.get("historicalTaxOnTaxDetected") is False; assert accounting.get("dynamicClientStatus")=="passed"; assert accounting.get("dynamicClientFailedCount")==0; assert accounting.get("dynamicClientUnverifiedCount")==0; assert accounting.get("dynamicClientPassedCount")==accounting.get("dynamicClientCount")' <<<"$verification"
          test "$http_status" = "200"
      - name: Capture Jesse and Dion QBO adjustment diagnostics
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-results
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          http_status="$(curl -sS \
            -o visual-results/accounting-adjustment-diagnostics.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"action":"read-accounting-adjustment-diagnostics","recordIds":["QBO-CUST-29","QBO-CUST-44"]}' \
            https://koasevents.com/api/system-health/github-main-signal)"
          cat visual-results/accounting-adjustment-diagnostics.json
          test "$http_status" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('visual-results/accounting-adjustment-diagnostics.json').read_text())
          assert data.get('ok') is True
          rows=data.get('diagnostics') or []
          by_id={row.get('recordId'):row for row in rows}
          assert set(by_id)=={'QBO-CUST-29','QBO-CUST-44'}
          for record_id in ('QBO-CUST-29','QBO-CUST-44'):
              row=by_id[record_id]
              assert row.get('status')=='verified'
              assert row.get('historicalQuickBooksImport') is True
              assert row.get('accountingScope')=='quickbooks-history'
              assert row.get('estimateId')
              assert isinstance(row.get('rawFields'),dict)
          print('Historical QBO adjustment diagnostics:',json.dumps(rows,separators=(',',':')))
          PY
      - name: Capture current safe accounting repair bulk preview
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-results
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          http_status="$(curl -sS \
            -o visual-results/accounting-repair-bulk-preview.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"action":"read-current-accounting-repair-bulk-preview"}' \
            https://koasevents.com/api/system-health/github-main-signal)"
          cat visual-results/accounting-repair-bulk-preview.json
          test "$http_status" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('visual-results/accounting-repair-bulk-preview.json').read_text())
          assert data.get('ok') is True
          preview=data.get('bulkPreview') or {}
          assert preview.get('bulkPreviewId')
          assert preview.get('approvalMode') == 'individual-write-only'
          assert isinstance(preview.get('rows'),list)
          assert all(row.get('status') in {'repairable','blocked','clean','error','unavailable','ineligible'} for row in preview['rows'])
          print('Production safe repair preview:',json.dumps({
              'bulkPreviewId':preview.get('bulkPreviewId'),
              'requestedCount':preview.get('requestedCount'),
              'repairableClientCount':preview.get('repairableClientCount'),
              'writeCount':preview.get('writeCount'),
              'blockedClientCount':preview.get('blockedClientCount'),
              'cleanClientCount':preview.get('cleanClientCount'),
              'errorClientCount':preview.get('errorClientCount'),
              'rows':preview.get('rows'),
          },separators=(',',':')))
          PY
      - name: Check public routes and headers
        run: python scripts/production_visual_qa.py --mode smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koa-production-smoke-${{ github.run_id }}
          path: |
            visual-results/production-smoke.json
            visual-results/accounting-adjustment-diagnostics.json
            visual-results/accounting-repair-bulk-preview.json
          retention-days: 14
          if-no-files-found: error

  production-theme-audit:
    name: Live Light / Dark / System audit
    if: github.event_name == 'push'
    needs: source-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build route inventory
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install browser QA dependencies
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Wait for exact Netlify production SHA
        run: python scripts/production_visual_qa.py --mode wait --wait-seconds 900
      - name: Verify live Light / Dark / System in Chromium
        run: python scripts/theme_visual_qa.py --browser chromium --base-url "$PRODUCTION_BASE_URL"
      - name: Verify live Light / Dark / System in WebKit
        run: python scripts/theme_visual_qa.py --browser webkit --base-url "$PRODUCTION_BASE_URL"
      - name: Publish Dark Mode visual-quality result to System Health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def summarize(browser):
              path=Path(f'visual-results/theme-{browser}/report.json')
              if not path.is_file():
                  return {
                      'browser':browser,
                      'routes':0,
                      'cases':0,
                      'failureCount':1,
                      'reportMissing':True,
                  }
              try:
                  report=json.loads(path.read_text())
              except Exception:
                  return {
                      'browser':browser,
                      'routes':0,
                      'cases':0,
                      'failureCount':1,
                      'reportMissing':True,
                  }
              return {
                  'browser':browser,
                  'routes':int(report.get('routes') or 0),
                  'cases':int(report.get('cases') or 0),
                  'failureCount':len(report.get('failures') or []),
                  'reportMissing':False,
              }

          payload={
              'action':'record-dark-mode-visual-quality',
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'chromium':summarize('chromium'),
              'webkit':summarize('webkit'),
          }
          Path('/tmp/dark-mode-visual-quality.json').write_text(json.dumps(payload,separators=(',',':')))
          print(json.dumps(payload,separators=(',',':')))
          PY
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          curl -fsS             -X POST             -H "Authorization: Bearer $token"             -H "Content-Type: application/json"             --data-binary @/tmp/dark-mode-visual-quality.json             https://koasevents.com/api/system-health/github-main-signal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koa-live-theme-${{ github.run_id }}
          path: |
            visual-results/theme-chromium
            visual-results/theme-webkit
          retention-days: 30
          if-no-files-found: error

  admin-startup-audit:
    name: Protected admin post-deploy audit
    if: github.event_name != 'pull_request'
    needs: source-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Wait for this exact Netlify deploy
        run: python scripts/production_visual_qa.py --mode wait --wait-seconds 900
      - name: Verify every protected admin page and API
        run: python scripts/production_visual_qa.py --mode admin --browser chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koa-admin-startup-${{ github.run_id }}
          path: visual-results/admin-chromium
          retention-days: 30
          if-no-files-found: error

  system-health-mobile-audit:
    name: System Health authenticated mobile screenshots
    if: github.event_name != 'pull_request' && always()
    needs: [deployed-smoke, production-theme-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mobile browser QA dependencies
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Run signed live System Health dashboard refresh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-results
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          http_status="$(curl -sS \
            -o visual-results/system-health-dashboard.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"action":"run-dashboard-refresh"}' \
            https://koasevents.com/api/system-health/github-main-signal)"
          cat visual-results/system-health-dashboard.json
          test "$http_status" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('visual-results/system-health-dashboard.json').read_text())
          current=data.get('current') or {}
          assert data.get('ok') is True
          assert current.get('checkedAt')
          assert isinstance(current.get('passed'),int)
          assert isinstance(current.get('failed'),int)
          assert current.get('overall') in {'healthy','unhealthy'}
          warnings=data.get('enrichmentWarnings') or []
          print('System Health live summary:', json.dumps({
              'overall':current.get('overall'),
              'passed':current.get('passed'),
              'failed':current.get('failed'),
              'checkedAt':current.get('checkedAt'),
              'enrichmentWarnings':warnings,
          },separators=(',',':')))
          PY
      - name: Verify authenticated mobile System Health in Chromium
        run: python scripts/production_visual_qa.py --mode health-mobile --browser chromium --health-payload visual-results/system-health-dashboard.json
      - name: Verify authenticated mobile System Health in WebKit
        run: python scripts/production_visual_qa.py --mode health-mobile --browser webkit --health-payload visual-results/system-health-dashboard.json
      - name: Publish System Health production release status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              p=Path(path)
              if not p.is_file():
                  return None
              try:
                  return json.loads(p.read_text())
              except Exception:
                  return None

          dashboard=load('visual-results/system-health-dashboard.json') or {}
          chromium=load('visual-results/health-mobile-chromium/report.json') or {}
          webkit=load('visual-results/health-mobile-webkit/report.json') or {}
          current=dashboard.get('current') or {}
          warnings=dashboard.get('enrichmentWarnings') or []
          expected_refresh='Partial' if warnings else 'Current'

          reports=[chromium,webkit]
          reports_complete=all(
              isinstance(report.get('results'),list)
              and len(report.get('results'))==7
              and not (report.get('failures') or [])
              for report in reports
          )
          refresh_checks=[]
          for report in reports:
              for row in report.get('results') or []:
                  after=(row.get('metrics') or {}).get('afterRunChecksNow') or {}
                  refresh_checks.append(
                      after.get('passed')==str(current.get('passed'))
                      and after.get('failed')==str(current.get('failed'))
                      and bool(after.get('checked'))
                      and after.get('dashboardRefresh')==expected_refresh
                  )

          ok=bool(
              dashboard.get('ok') is True
              and current.get('checkedAt')
              and isinstance(current.get('passed'),int)
              and isinstance(current.get('failed'),int)
              and current.get('overall') in {'healthy','unhealthy'}
              and reports_complete
              and len(refresh_checks)==14
              and all(refresh_checks)
          )

          overall=str(current.get('overall') or 'unknown').title()
          passed=current.get('passed','?')
          failed=current.get('failed','?')
          description=f'{overall} · {passed} passed · {failed} failed · Refresh {expected_refresh} · 14 responsive checks'
          payload={
              'state':'success' if ok else 'failure',
              'context':'System Health production release gate',
              'description':description[:140],
          }
          Path('/tmp/system-health-commit-status.json').write_text(json.dumps(payload,separators=(',',':')))
          print(json.dumps({
              'ok':ok,
              'overall':current.get('overall'),
              'passed':current.get('passed'),
              'failed':current.get('failed'),
              'checkedAt':current.get('checkedAt'),
              'dashboardRefresh':expected_refresh,
              'enrichmentWarnings':warnings,
              'chromiumViewports':len(chromium.get('results') or []),
              'webkitViewports':len(webkit.get('results') or []),
              'chromiumFailures':chromium.get('failures') or [],
              'webkitFailures':webkit.get('failures') or [],
          },separators=(',',':')))
          PY
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/tmp/system-health-commit-status.json')
          data=json.loads(p.read_text())
          data['target_url']=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          p.write_text(json.dumps(data,separators=(',',':')))
          PY
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/system-health-commit-status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koa-system-health-mobile-${{ github.run_id }}
          path: |
            visual-results/system-health-dashboard.json
            visual-results/health-mobile-chromium
            visual-results/health-mobile-webkit
          retention-days: 30
          if-no-files-found: error
  visual-audit:
    name: Responsive visual audit
    if: github.event_name != 'pull_request'
    needs: deployed-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Audit responsive staging experience
        run: python scripts/production_visual_qa.py --mode browser --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koa-visual-qa-${{ matrix.browser }}-${{ github.run_id }}
          path: visual-results/browser-${{ matrix.browser }}
          retention-days: 30
          if-no-files-found: error

  qa-summary:
    name: Visual QA summary
    if: always()
    needs: [source-build-audit, deployed-smoke, production-theme-audit, admin-startup-audit, system-health-mobile-audit, visual-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Publish run summary
        run: |
          {
            echo '## Koa’s Events production visual QA'
            echo
            echo '| Gate | Result |'
            echo '| --- | --- |'
            echo '| Source + Astro build | ${{ needs.source-build-audit.result }} |'
            echo '| Live production route smoke | ${{ needs.deployed-smoke.result }} |'
            echo '| Live Light / Dark / System audit | ${{ needs.production-theme-audit.result }} |'
            echo '| Protected admin post-deploy audit | ${{ needs.admin-startup-audit.result }} |'
            echo '| Authenticated System Health mobile screenshots | ${{ needs.system-health-mobile-audit.result }} |'
            echo '| Live responsive visual audit | ${{ needs.visual-audit.result }} |'
            echo
            echo 'The browser artifacts contain full-page screenshots, report.json, and a human-readable report.html.'
          } >> "$GITHUB_STEP_SUMMARY"
