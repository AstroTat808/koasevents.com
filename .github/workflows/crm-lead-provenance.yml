name: CRM lead provenance integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lead-provenance-regression:
    name: Lead origin and audit ledger tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate provenance snapshots and audit ledger
        run: node scripts/test_crm_lead_provenance.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build site with provenance UI and Netlify routes
        run: npm run build
