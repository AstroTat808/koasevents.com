name: CRM read-only production identity audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: koa-crm-readonly-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-safety:
    name: Read-only CRM and internal email QA safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise privacy, record integrity and safe recipient selection
        run: node --test scripts/test_crm_readonly_production_audit.mjs scripts/test_email_production_recipient.mjs scripts/test_crm_migration_preview_no_writes.mjs

  signed-production-audit:
    name: Signed production CRM totals and first-batch preview
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: synthetic-safety
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Fetch a signed exact-production read-only CRM audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          status="000"
          for attempt in $(seq 1 45); do
            token="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=koasevents-system-health" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
            status="$(curl -sS --connect-timeout 15 --max-time 60 -o /tmp/koa-crm-private-response.json \
              -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              -d '{"action":"read-only-crm-identity-audit"}' \
              https://koasevents.com/api/system-health/github-main-signal || true)"
            if [ "$status" = "200" ]; then break; fi
            echo "Signed CRM audit awaiting exact production release (HTTP $status); attempt $attempt/45."
            if [ "$attempt" != 45 ]; then sleep 20; fi
          done
          if [ "$status" != "200" ]; then
            echo '::error::Exact-SHA customer audit unavailable. Private response withheld.'
            exit 1
          fi
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          try:
              envelope=json.loads(Path('/tmp/koa-crm-private-response.json').read_text())
              assert envelope.get('ok') is True and envelope.get('sha')==os.environ['GITHUB_SHA']
              assert re.fullmatch(r'[a-f0-9]{24}',str(envelope.get('deployId','')))
              audit=envelope['audit']
              assert audit['schemaVersion']==1 and audit['readOnly'] is True and audit['customerDataMutations']==0
              assert audit['status'] in ('ready','review_required','blocked')
              names=('rawRecordCount','activeRecords','uniqueCustomers','projects','customerOnlyLeads',
                'customerGroupsWithMultipleProjects','explicitCustomerLinks','recordsMissingCustomerId',
                'noteCount','taskCount','noteOrphans','taskOrphans','duplicateRecordIds','malformedRecords',
                'foreignTenantRecords','unassignedProjectGroupLinks','missingDirectoryMemberships','identityReviewGroups')
              totals={k:audit.get('totals',{}).get(k,0) for k in names}
              assert all(type(v) is int and v>=0 for v in totals.values())
              totals['projectCountMismatch']=audit.get('totals',{}).get('projectCountMismatch') is True
              financeNames=('bookingPayments','quickBooksInvoices','quickBooksPayments',
                'projectsWithBookings','projectsWithContracts')
              finance={k:audit['financeCounts'][k] for k in financeNames}
              assert all(type(v) is int and v>=0 for v in finance.values())
              allowed=('linked_contact_conflict','duplicate_customer_lead','shared_email',
                'shared_phone','unverified_name_match','possible_duplicate_project','other')
              categories={k:0 for k in allowed}
              for k,v in audit.get('reviewCategories',{}).items():
                  assert k in categories and type(v) is int and v>=0
                  categories[k]=v
              p=audit['preview']
              assert p['status'] in ('review_ready','no_eligible_assignments','blocked')
              assert p['maxBatchSize']==12 and p['changeType']=='assign_missing_customer_id_only'
              assert p['independentApprovalRequired'] is True and p['automaticallyApplied'] is False
              counts=('assignmentCount','totalEligible','remainingAfterBatch','eligibleCustomerGroups')
              preview={k:p[k] for k in counts}
              assert all(type(v) is int and v>=0 for v in preview.values())
              preview.update({'status':p['status'],'maxBatchSize':12})
              if p['status']=='blocked': assert preview['assignmentCount']==0
              src={k:audit['source'][k] for k in ('index','notes','tasks')}
              assert all(v in ('canonical','legacy','missing') for v in src.values())
              safe={'schemaVersion':1,'source':'signed-exact-production-GitHub-OIDC',
                'sha':envelope['sha'],'deployId':envelope['deployId'],
                'audit':{'status':audit['status'],'readOnly':True,'customerDataMutations':0,
                  'source':src,'totals':totals,'reviewCategories':categories,'financeCounts':finance,'preview':preview}}
              Path('evidence/crm-identity-aggregate.json').write_text(json.dumps(safe,indent=2)+'\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('### Signed read-only CRM identity audit\n\n')
                  f.write('Commit: '+safe['sha']+'; deploy: '+safe['deployId']+'\n\n')
                  f.write('Customers: '+str(totals['uniqueCustomers'])+'; projects: '+str(totals['projects'])+'; review groups: '+str(totals['identityReviewGroups'])+'\n\n')
                  f.write('First safe batch: '+str(preview['assignmentCount'])+' ID assignments; status: '+preview['status']+'. No customer records changed.\n')
              print('Read-only exact-SHA CRM audit verified. Aggregate artifact retained.')
          except Exception:
              raise SystemExit('KOA_CRM_READONLY_AGGREGATE_VALIDATION_FAILED (private payload withheld)')
          PY
      - name: Publish aggregate-only evidence for administrator review
        uses: actions/upload-artifact@v4
        with:
          name: koa-readonly-crm-identity-aggregate
          path: evidence/crm-identity-aggregate.json
          retention-days: 30
