name: Branch hygiene

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-hygiene.yml'
      - '.github/branch-hygiene-policy.json'
      - 'scripts/branch_hygiene.py'
      - 'docs/branch-hygiene.md'
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-hygiene-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'default' }}
  cancel-in-progress: false

jobs:
  inventory:
    name: Classify every branch and test safety rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test classifier safety and seven-day boundaries
        run: python3 scripts/branch_hygiene.py --self-test
      - name: Generate complete read-only inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/branch_hygiene.py --out branch-hygiene-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branch-hygiene-${{ github.run_id }}-${{ github.run_attempt }}
          path: branch-hygiene-report/
          retention-days: 90
          if-no-files-found: error

  tracking-issue:
    name: Update one seven-day maintenance queue
    needs: inventory
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: branch-hygiene-${{ github.run_id }}-${{ github.run_attempt }}
          path: branch-hygiene-report
      - name: Flag stale evidence without deleting branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/branch_hygiene.py --publish-report branch-hygiene-report/report.json
