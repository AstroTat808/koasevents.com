name: Critical Integrations rollback drill

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/critical-integrations-rollback-drill.yml'
      - 'netlify/functions/_shared/critical-integration-release-guard.mjs'
      - 'netlify/functions/_shared/critical-integration-audit.mjs'
      - 'netlify/functions/_shared/system-health.ts'
      - 'netlify/functions/admin-health.mts'
      - 'netlify/functions/github-main-health-signal.ts'
      - 'src/pages/admin/health/index.astro'
      - 'scripts/test_critical_integration_rollback_drill.mjs'
      - 'scripts/test_critical_integration_audit_filters.mjs'
      - 'scripts/test_synthetic_health_protocol.mjs'
      - 'scripts/test_ci_sensitive_data_guard.mjs'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/critical-integrations-rollback-drill.yml'
      - 'netlify/functions/_shared/critical-integration-release-guard.mjs'
      - 'netlify/functions/_shared/critical-integration-audit.mjs'
      - 'netlify/functions/_shared/system-health.ts'
      - 'netlify/functions/admin-health.mts'
      - 'netlify/functions/github-main-health-signal.ts'
      - 'src/pages/admin/health/index.astro'
      - 'scripts/test_critical_integration_rollback_drill.mjs'
      - 'scripts/test_critical_integration_audit_filters.mjs'
      - 'scripts/test_synthetic_health_protocol.mjs'
      - 'scripts/test_ci_sensitive_data_guard.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  EXPECTED_COMMIT: ${{ github.sha }}
  PRODUCTION_BASE_URL: https://koasevents.com

jobs:
  rollback-drill:
    name: Safe non-production rollback drill
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DRILL_ENVIRONMENT: github-actions-non-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test audit filters
        run: node scripts/test_critical_integration_audit_filters.mjs
      - name: Prevent sensitive production data in CI logs and artifacts
        run: node scripts/test_ci_sensitive_data_guard.mjs
      - name: Deliberately fail one synthetic probe and prove simulated recovery
        run: node scripts/test_critical_integration_rollback_drill.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-integrations-rollback-drill-${{ github.run_id }}
          path: visual-results/critical-integration-rollback-drill.json
          retention-days: 90
          if-no-files-found: error

  real-sandbox-restore:
    name: Real Netlify sandbox restore drill
    if: github.event_name != 'pull_request'
    needs: rollback-drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the exact production control-plane commit
        run: python scripts/production_visual_qa.py --mode wait --wait-seconds 900
      - name: Create two sandbox deploys and restore the known-good deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-results
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          raw_file="/tmp/koa-critical-integration-real-rollback.raw.json"
          summary_file="visual-results/critical-integration-real-rollback-summary.json"
          trap 'rm -f "$raw_file"' EXIT
          http_status="$(curl -sS -o "$raw_file" -w "%{http_code}" -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{"action":"run-real-sandbox-rollback-drill"}' https://koasevents.com/api/system-health/github-main-signal)"
          test "$http_status" = "200"
          python - "$raw_file" "$summary_file" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          drill=data.get('sandboxRollbackDrill') or {}
          assert data.get('ok') is True
          assert drill.get('ok') is True
          assert drill.get('mode') == 'real-netlify-sandbox-restore'
          assert drill.get('isolationVerified') is True
          assert drill.get('productionMutationAttempted') is False
          assert drill.get('sandboxMutationAttempted') is True
          assert drill.get('sandboxSiteId') != drill.get('productionSiteId')
          assert drill.get('beforeRestore',{}).get('deployId') == drill.get('candidate',{}).get('deployId')
          assert drill.get('afterRestore',{}).get('deployId') == drill.get('knownGood',{}).get('deployId')
          assert drill.get('restore',{}).get('httpStatus') in (200,201)
          phases=drill.get('phases') or []
          assert all(phase.get('ok') for phase in phases)
          summary={
              'ok':True,
              'mode':'real-netlify-sandbox-restore',
              'isolationVerified':True,
              'productionMutationAttempted':False,
              'sandboxMutationAttempted':True,
              'restoreHttpStatus':drill.get('restore',{}).get('httpStatus'),
              'phaseCount':len(phases),
              'failedPhaseCount':sum(1 for phase in phases if not phase.get('ok')),
          }
          Path(sys.argv[2]).write_text(json.dumps(summary,separators=(',',':')),encoding='utf-8')
          print(json.dumps(summary,separators=(',',':')))
          PY
          rm -f "$raw_file"
          trap - EXIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-integrations-real-netlify-rollback-${{ github.run_id }}
          path: visual-results/critical-integration-real-rollback-summary.json
          retention-days: 90
          if-no-files-found: error
      - name: Verify signed production accounting audit availability
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          raw_file="/tmp/koa-production-accounting-audits.raw.json"
          summary_file="visual-results/production-accounting-audits-summary.json"
          trap 'rm -f "$raw_file"' EXIT
          http_status="$(curl -sS -o "$raw_file" -w "%{http_code}" -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{"action":"read-production-accounting-audits"}' https://koasevents.com/api/system-health/github-main-signal)"
          test "$http_status" = "200"
          python - "$raw_file" "$summary_file" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          audits=data.get('accountingAudits')
          assert data.get('ok') is True
          assert isinstance(audits,list)
          summary={
              'ok':True,
              'auditCount':len(audits),
              'hasAuditHistory':bool(audits),
          }
          Path(sys.argv[2]).write_text(json.dumps(summary,separators=(',',':')),encoding='utf-8')
          print(json.dumps(summary,separators=(',',':')))
          PY
          rm -f "$raw_file"
          trap - EXIT

      - name: Prove isolated five-minute self-healing retrigger
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          raw_file="/tmp/koa-netlify-sandbox-self-heal.raw.json"
          summary_file="visual-results/netlify-sandbox-self-heal-summary.json"
          trap 'rm -f "$raw_file"' EXIT
          http_status="$(curl -sS -o "$raw_file" -w "%{http_code}" -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{"action":"run-sandbox-self-heal-drill"}' https://koasevents.com/api/system-health/github-main-signal)"
          test "$http_status" = "200"
          python - "$raw_file" "$summary_file" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          drill=data.get('sandboxSelfHealDrill') or {}
          assert data.get('ok') is True
          assert drill.get('ok') is True
          assert drill.get('gracePeriodSeconds') == 300
          assert drill.get('graceElapsed') is True
          assert drill.get('exactShaPresentBefore') is False
          assert drill.get('retriggered') is True
          assert drill.get('sandboxMutationAttempted') is True
          assert drill.get('productionMutationAttempted') is False
          assert drill.get('isolationVerified') is True
          assert drill.get('markerVerified') is True
          assert drill.get('after',{}).get('deployId') == drill.get('retrigger',{}).get('deployId')
          phases=drill.get('phases') or []
          assert all(phase.get('ok') for phase in phases)
          summary={
              'ok':True,
              'gracePeriodSeconds':300,
              'graceElapsed':True,
              'retriggered':True,
              'sandboxMutationAttempted':True,
              'productionMutationAttempted':False,
              'isolationVerified':True,
              'markerVerified':True,
              'phaseCount':len(phases),
              'failedPhaseCount':sum(1 for phase in phases if not phase.get('ok')),
          }
          Path(sys.argv[2]).write_text(json.dumps(summary,separators=(',',':')),encoding='utf-8')
          print(json.dumps(summary,separators=(',',':')))
          PY
          rm -f "$raw_file"
          trap - EXIT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netlify-sandbox-self-heal-and-accounting-audits-${{ github.run_id }}
          path: |
            visual-results/netlify-sandbox-self-heal-summary.json
            visual-results/production-accounting-audits-summary.json
          retention-days: 90
          if-no-files-found: error

