name: Critical Integrations rollback drill

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/critical-integrations-rollback-drill.yml'
      - 'netlify/functions/_shared/critical-integration-release-guard.mjs'
      - 'netlify/functions/_shared/critical-integration-audit.mjs'
      - 'netlify/functions/_shared/system-health.ts'
      - 'netlify/functions/admin-health.mts'
      - 'netlify/functions/github-main-health-signal.ts'
      - 'src/pages/admin/health/index.astro'
      - 'scripts/test_critical_integration_rollback_drill.mjs'
      - 'scripts/test_critical_integration_audit_filters.mjs'
      - 'scripts/test_synthetic_health_protocol.mjs'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/critical-integrations-rollback-drill.yml'
      - 'netlify/functions/_shared/critical-integration-release-guard.mjs'
      - 'netlify/functions/_shared/critical-integration-audit.mjs'
      - 'netlify/functions/_shared/system-health.ts'
      - 'netlify/functions/admin-health.mts'
      - 'netlify/functions/github-main-health-signal.ts'
      - 'src/pages/admin/health/index.astro'
      - 'scripts/test_critical_integration_rollback_drill.mjs'
      - 'scripts/test_critical_integration_audit_filters.mjs'
      - 'scripts/test_synthetic_health_protocol.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  EXPECTED_COMMIT: ${{ github.sha }}
  PRODUCTION_BASE_URL: https://koasevents.com

jobs:
  rollback-drill:
    name: Safe non-production rollback drill
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DRILL_ENVIRONMENT: github-actions-non-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test audit filters
        run: node scripts/test_critical_integration_audit_filters.mjs
      - name: Deliberately fail one synthetic probe and prove simulated recovery
        run: node scripts/test_critical_integration_rollback_drill.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-integrations-rollback-drill-${{ github.run_id }}
          path: visual-results/critical-integration-rollback-drill.json
          retention-days: 90
          if-no-files-found: error

  real-sandbox-restore:
    name: Real Netlify sandbox restore drill
    if: github.event_name != 'pull_request'
    needs: rollback-drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the exact production control-plane commit
        run: python scripts/production_visual_qa.py --mode wait --wait-seconds 900
      - name: Create two sandbox deploys and restore the known-good deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-results
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          report_file="visual-results/critical-integration-real-rollback-drill.json"
          http_status="$(curl -sS             -o "$report_file"             -w "%{http_code}"             -X POST             -H "Authorization: Bearer $token"             -H "Content-Type: application/json"             --data '{"action":"run-real-sandbox-rollback-drill"}'             https://koasevents.com/api/system-health/github-main-signal)"
          python -c 'import json,sys; data=json.load(open(sys.argv[1])); drill=data.get("sandboxRollbackDrill") or {}; assert data.get("ok") is True; assert drill.get("ok") is True; assert drill.get("mode")=="real-netlify-sandbox-restore"; assert drill.get("isolationVerified") is True; assert drill.get("productionMutationAttempted") is False; assert drill.get("sandboxMutationAttempted") is True; assert drill.get("sandboxSiteId") != drill.get("productionSiteId"); assert drill.get("sandboxSiteName")=="koasevents-rollback-drill-sandbox"; assert drill.get("beforeRestore",{}).get("deployId")==drill.get("candidate",{}).get("deployId"); assert drill.get("afterRestore",{}).get("deployId")==drill.get("knownGood",{}).get("deployId"); assert drill.get("restore",{}).get("httpStatus") in (200,201); assert all(p.get("ok") for p in drill.get("phases",[]))' "$report_file"
          test "$http_status" = "200"
          echo "Sandbox drill response validated without logging response content."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-integrations-real-netlify-rollback-${{ github.run_id }}
          path: visual-results/critical-integration-real-rollback-drill.json
          retention-days: 90
          if-no-files-found: error
      - name: Prove isolated five-minute self-healing retrigger
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=koasevents-system-health")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          report_file="visual-results/netlify-sandbox-self-heal-drill.json"
          http_status="$(curl -sS             -o "$report_file"             -w "%{http_code}"             -X POST             -H "Authorization: Bearer $token"             -H "Content-Type: application/json"             --data '{"action":"run-sandbox-self-heal-drill"}'             https://koasevents.com/api/system-health/github-main-signal)"
          python -c 'import json,sys; data=json.load(open(sys.argv[1])); drill=data.get("sandboxSelfHealDrill") or {}; assert data.get("ok") is True; assert drill.get("ok") is True; assert drill.get("gracePeriodSeconds")==300; assert drill.get("graceElapsed") is True; assert drill.get("exactShaPresentBefore") is False; assert drill.get("retriggered") is True; assert drill.get("sandboxMutationAttempted") is True; assert drill.get("productionMutationAttempted") is False; assert drill.get("isolationVerified") is True; assert drill.get("markerVerified") is True; assert drill.get("after",{}).get("deployId")==drill.get("retrigger",{}).get("deployId"); assert all(p.get("ok") for p in drill.get("phases",[]))' "$report_file"
          test "$http_status" = "200"
          echo "Sandbox drill response validated without logging response content."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netlify-sandbox-self-heal-${{ github.run_id }}
          path: visual-results/netlify-sandbox-self-heal-drill.json
          retention-days: 90
          if-no-files-found: error

