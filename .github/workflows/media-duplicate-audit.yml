name: Media duplicate audit

on:
  push:
    branches: [main]
    paths:
      - 'public/media/wix/**'
      - 'scripts/media_duplicate_audit.py'
      - '.github/workflows/media-duplicate-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image analysis dependencies
        run: pip install Pillow==11.3.0 ImageHash==4.3.2
      - name: Analyze exact and perceptual duplicates
        run: python scripts/media_duplicate_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koa-media-dedupe-${{ github.run_id }}
          path: visual-results/media-dedupe/report.json
          retention-days: 30
          if-no-files-found: error
