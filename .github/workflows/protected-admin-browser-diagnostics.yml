name: Protected admin browser diagnostics (privacy-safe)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/protected-admin-browser-diagnostics.yml'
      - 'scripts/sanitize_protected_admin_qa.py'
      - 'scripts/test_sanitized_protected_admin_qa.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-admin-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert browser result redaction policy
        run: python scripts/test_sanitized_protected_admin_qa.py
      - name: Install Chromium for read-only browser checks
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify production admin routes and print only sanitized diagnostic codes
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf /tmp/koa-protected-admin-private.log visual-results/admin-chromium' EXIT
          code=0
          python scripts/production_visual_qa.py --mode admin --browser chromium > /tmp/koa-protected-admin-private.log 2>&1 || code=$?
          python scripts/sanitize_protected_admin_qa.py --report visual-results/admin-chromium/report.json --qa-exit "$code"
