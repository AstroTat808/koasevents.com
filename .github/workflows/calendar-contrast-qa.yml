name: Calendar contrast regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calendar-contrast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  calendar-contrast:
    name: Calendar contrast - Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build with every existing prebuild safeguard
        run: npm install --no-audit --no-fund && npm run build
      - name: Install isolated browser regression dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Test populated Calendar dates without production traffic
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/calendar-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/admin/calendar/ >/dev/null; then break; fi
            sleep 1
          done
          python scripts/test_calendar_contrast.py --base-url http://127.0.0.1:4173
      - name: Retain synthetic numeric contrast evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-contrast-${{ github.run_id }}-${{ github.run_attempt }}
          path: visual-results/calendar-contrast.json
          if-no-files-found: error
          retention-days: 14
