name: Deploy production to Netlify

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'netlify/**'
      - 'public/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'netlify.toml'
      - 'package.json'
      - '.github/workflows/netlify-production-deploy.yml'
  workflow_dispatch:

concurrency:
  group: koasevents-netlify-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: a27d5e15-a2fd-4617-87f8-7b45f062fdab
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Netlify deployment credentials
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::GitHub secret NETLIFY_AUTH_TOKEN is not configured for this repository."
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy current main to Koa's production site
        run: npx --yes netlify-cli@latest deploy --build --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "GitHub main $GITHUB_SHA"
