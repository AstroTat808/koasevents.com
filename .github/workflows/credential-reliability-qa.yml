name: Credential reliability browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: credential-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-reliability:
    name: Credential reliability (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      KOA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the exact reviewed source
        run: |
          test "$(git rev-parse HEAD)" = "$KOA_PR_HEAD_SHA"
          npm install --no-audit --no-fund
          npm run build
          node --check public/credential-reliability-cards.js
          node scripts/test_system_health_collapse_runtime.mjs
      - name: Install browser
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Test real compiled UI with synthetic session and health responses
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4180 --directory dist > /tmp/credential-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4180/admin/health/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          python scripts/test_credential_reliability_browser.py --browser ${{ matrix.browser }} --base-url http://127.0.0.1:4180
      - name: Wait for matching public UI assets before production smoke test
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path
          paths=['credential-reliability-cards.js','system-health-collapse.js']
          expected={path:hashlib.sha256((Path('public')/path).read_bytes()).hexdigest() for path in paths}
          for attempt in range(45):
              try:
                  matches=[]
                  for path in paths:
                      request=urllib.request.Request('https://koasevents.com/'+path,headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=20) as response:
                          matches.append(hashlib.sha256(response.read()).hexdigest()==expected[path])
                  if all(matches):
                      print('Matching credential UI assets are live; no protected API was queried.')
                      break
              except Exception:
                  pass
              time.sleep(20)
          else:
              raise SystemExit('Production credential UI assets did not match reviewed source in time.')
          PY
      - name: Verify the production UI with synthetic data only
        if: github.event_name == 'push'
        run: python scripts/test_credential_reliability_browser.py --browser ${{ matrix.browser }} --base-url https://koasevents.com --out visual-results/credential-reliability-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-reliability-synthetic-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            visual-results/credential-reliability
            visual-results/credential-reliability-production
          if-no-files-found: error
          retention-days: 14
